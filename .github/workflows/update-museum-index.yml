name: Update museum visual index
on:
  # Rebuild when the workflow or the reviewed masterpiece catalogue changes.
  # Data commits go to art-index, so they do not recursively trigger this job.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-museum-index.yml'
      - 'tools/art-index/bootstrap/masterpieces.json'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify independent CPU inference from cached catalogue
        type: boolean
        default: false
  schedule:
    - cron: '43 10 * * *'
permissions:
  contents: write
concurrency:
  group: museum-visual-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v6
        with:
          path: tools/art-index/cache
          key: museum-visual-index-v2-${{ github.run_id }}
          restore-keys: museum-visual-index-v2-
      - run: python -m pip install -r tools/art-index/requirements.txt
      - uses: actions/checkout@v7
        with:
          ref: art-index
          path: index-publication
      - name: Collect new metadata, analyze missing images and build verified data
        run: python tools/art-index/run.py --publish-dir index-publication ${{ inputs.verify_only && '--skip-collection --verify-portability' || '' }}
      - name: Publish index data
        working-directory: index-publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh museum visual recommendations'
            git push origin HEAD:art-index
          fi
      - name: Save resumable build cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: tools/art-index/cache
          key: museum-visual-index-v2-${{ github.run_id }}

