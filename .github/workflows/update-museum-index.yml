name: Update museum visual index
on:
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * *'
permissions:
  contents: write
concurrency:
  group: museum-visual-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: tools/art-index/cache
          key: museum-visual-index-v2-${{ github.run_id }}
          restore-keys: museum-visual-index-v2-
      - run: python -m pip install -r tools/art-index/requirements.txt
      - uses: actions/checkout@v7
        with:
          ref: art-index
          path: index-publication
      - name: Collect new metadata, analyze missing images and build verified data
        run: python tools/art-index/run.py --publish-dir index-publication
      - name: Publish index data
        working-directory: index-publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'manifest.json' 'art-index-*.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh museum visual recommendations'
            git push origin HEAD:art-index
          fi
